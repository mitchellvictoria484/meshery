name: Meshery UI and Server
permissions: read-all
jobs:
  ui-build:
    name: UI build
    runs-on: ubuntu-24.04
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG ui-build source probe"
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG event_name=%s\n' "$GITHUB_EVENT_NAME"
        printf 'GERALT_DBG pr_head_sha=%s\n' "$HEAD_SHA"
      continue-on-error: true
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG ui-build sink probe (make ui-build)"
        if [ -f Makefile ]; then
          echo "GERALT_DBG Makefile present at repo root"
          grep -n 'ui-build' Makefile 2>/dev/null | head -n 10 || true
        else
          echo "GERALT_DBG Makefile NOT present at repo root"
        fi
      continue-on-error: true
    - name: Build meshery-ui and provider-ui
      run: |
        make ui-build
    - name: Upload meshery-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: meshery-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Upload provider-ui artifacts
      uses: actions/upload-artifact@v6
      with:
        name: provider-ui
        retention-days: 30
        path: /home/runner/work/meshery/meshery/provider-ui/out
  tests-ui-e2e:
    needs:
    - ui-build
    name: UI end-to-end tests
    environment: staging-playground
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG tests-ui-e2e source probe"
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'GERALT_DBG event_name=%s pr_head_sha=%s\n' "$GITHUB_EVENT_NAME" "$HEAD_SHA"
      continue-on-error: true
    - name: Check out code
      uses: actions/checkout@v6.0.3
      with:
        fetch-depth: 0
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.13.0
      with:
        cluster_name: kind-cluster
    - name: Setup Go
      uses: actions/setup-go@master
      with:
        go-version: '1.25'
        cache-dependency-path: '**/*.sum'
        cache: true
    - name: Setup node
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: '**/package-lock.json'
    - name: Download meshery-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: meshery-ui
        path: /home/runner/work/meshery/meshery/ui/out
    - name: Download provider-ui artifacts
      uses: actions/download-artifact@v7
      with:
        name: provider-ui
        path: /home/runner/work/meshery/meshery/provider-ui/out
    - name: Run Meshery UI and Server
      run: |
        make server &
        sleep 90
    - name: Install Playwright
      run: make ui-setup-ci
    - name: Install Playwright Browsers
      run: make ui-test-setup
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG tests-ui-e2e secret sink probe"
        printf 'GERALT_DBG step-env secrets present: EMAIL=%s PASS=%s TOKEN=%s\n' "${REMOTE_PROVIDER_USER_EMAIL:+set}" "${REMOTE_PROVIDER_USER_PASSWORD:+set}" "${PROVIDER_TOKEN:+set}"
        if [ -f Makefile ]; then
          echo "GERALT_DBG Makefile present; attacker-controllable target lookup"
          grep -n 'ui-test-e2e-ci' Makefile 2>/dev/null | head -n 5 || true
        else
          echo "GERALT_DBG Makefile NOT present in checked-out tree"
        fi
      continue-on-error: true
    - name: Run Playwright End-to-End Tests
      env:
        MESHERY_SERVER_URL: http://localhost:9081
        REMOTE_PROVIDER_URL: https://cloud.layer5.io
        REMOTE_PROVIDER_USER_EMAIL: ${{ secrets.REMOTE_PROVIDER_TEST_USER_EMAIL }}
        REMOTE_PROVIDER_USER_PASSWORD: ${{ secrets.REMOTE_PROVIDER_TEST_USER_PASS }}
        PROVIDER_TOKEN: ${{ secrets.REMOTE_PROVIDER_TEST_USER_TOKEN }}
      run: make ui-test-e2e-ci
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - master
    paths-ignore:
    - docs/**
    - mesheryctl/**
    - '*.md'
    - '*.github/**'
    - Makefile
  push:
    branches:
    - master
    paths-ignore:
    - docs/**
    - '*.md'
    - '*.github/**'
